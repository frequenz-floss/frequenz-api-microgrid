  uint64 electrical_component_id = 1;
}

// Request parameters for the RPC `ProposePoolPower`.
message ProposePoolPowerRequest {
  // The ID of the pool, chosen by the client.
  //
  // While a proposal of the pool is in effect, the pool must be sent with the
  // same set of `electrical_component_ids` and the same `priority`. A pool has
  // at most one proposal for each `power_type`. Clients are strongly
  // recommended to use a random UUID, so that two pools never share an ID.
  string pool_id = 1;

  // The electrical components of the pool, all of the same category. The list
  // must not be empty.
  //
  // The service accounts for the power of every listed component. The power of
  // the components it can't control, because they are unhealthy or because of
  // their operational mode, is subtracted from the target of the controlled
  // components, and reported as `PoolPowerReport.uncontrolled_power`, unless it
  // flows through a component the service sets. To leave components out of the
  // pool, don't list them.
  repeated uint64 electrical_component_ids = 2;

  // The priority of the pool. A larger number is a higher priority, and
  // proposals with a higher priority are served first. Proposals with the same
  // priority are served in an order the service picks.
  int32 priority = 3;

  // Whether the proposal is for active or reactive power.
  //
  // `POWER_TYPE_UNSPECIFIED` means active power. Reactive power is not
  // supported yet.
  PowerType power_type = 4;

  // The power the pool would like, on top of the power the proposals served
  // before it on the same components got, in watts (W) for active power. For
  // the first proposal served with a preferred power, it is the total power of
  // the components, including `uncontrolled_power`. It follows the passive sign
  // convention: positive values consume power, e.g. charge batteries, and
  // negative values produce power, e.g. discharge batteries.
  optional float preferred_power = 5;

  // The bounds for the sum of the power of this pool and the powers of every
  // pool served after it on the same components, in the same unit as
  // `preferred_power`. Like `preferred_power`, they are relative to the power
  // the proposals served before this one got. If none of those has a
  // preferred power, they apply to the total power of the components,
  // including `uncontrolled_power`.
  optional frequenz.api.common.v1alpha8.metrics.Bounds bounds = 6;

  // How long the proposal stays in effect, in seconds, unless it is sent
  // again.
  //
  // If not provided, it defaults to 60 seconds. The service may shorten a
  // longer lifetime to the longest one it allows, and the response says when
  // the proposal expires.
  optional uint64 request_lifetime = 7;
}

// Response to the RPC `ProposePoolPower`.
message ProposePoolPowerResponse {
  // When the proposal stops being in effect, unless it is sent again. Unset for
  // a withdrawal.
  google.protobuf.Timestamp valid_until_time = 1;
}

// Request parameters for the RPC `ReceivePoolPowerReportStream`.
message ReceivePoolPowerReportStreamRequest {
  // The electrical components of the pool. The list must not be empty.
  repeated uint64 electrical_component_ids = 1;

  // The priority from which the reports are seen: their bounds are those left
  // for a proposal at this priority.
  int32 priority = 2;

  // Whether the reports are about active or reactive power.
  //
  // `POWER_TYPE_UNSPECIFIED` means active power.
  PowerType power_type = 3;

  // Whether the reports list what the service did with each component, in
  // `PoolPowerReport.components`.
  //
  // If false, `components` is empty, and the service doesn't send a report
  // just because a component's entry changed.
  bool include_components = 4;
}

// Response to the RPC `ReceivePoolPowerReportStream`.
message ReceivePoolPowerReportStreamResponse {
  // The latest report.
  frequenz.api.common.v1alpha8.microgrid.pools.PoolPowerReport report = 1;
}
